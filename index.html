<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日早报</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#25323a;background:#f4f3ef}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:0 28px}header{background:#163c3c;color:#fff;padding:24px 0 58px}.brand{font-size:13px;letter-spacing:.16em;color:#a5c4b5}.mast{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-top:50px}h1{font-family:Georgia,serif;font-size:clamp(34px,6vw,55px);letter-spacing:.04em;margin:0}.sub{font-size:14px;color:#cee0d5;line-height:1.8;margin:12px 0 0}.date{font-size:14px;color:#c5d8cc;white-space:nowrap}.app{margin-top:-25px}.controls{display:flex;gap:12px;flex-wrap:wrap;background:white;border:1px solid #e5e7df;border-radius:12px;padding:12px;box-shadow:0 5px 25px #1f30300d}button,select{font:inherit;border-radius:8px;padding:11px 16px;cursor:pointer}button{border:0;background:transparent;color:#52635e}button.active{color:white;background:#1e514c}select{border:1px solid #e3e8e3;color:#2e4740;background:#fff;margin-left:auto}.highlights{background:#fff;border:1px solid #e5e7df;border-radius:12px;padding:20px 26px;margin-top:22px;line-height:1.8}.highlights h2{font-size:19px;color:#193d39;margin:0}.highlights p{color:#66756e;margin:5px 0}.highlights ol{margin:8px 0;padding-left:24px}.topics{background:#fff;border:1px solid #e5e7df;border-radius:12px;padding:22px 26px;margin-top:22px}.topics h2{font-size:19px;color:#193d39;margin:0 0 5px}.topics p{font-size:13px;color:#66756e;line-height:1.7}.topic-controls{display:flex;flex-wrap:wrap;gap:8px}.topic-controls button{background:#f1f5f1;padding:8px 12px}.topic-controls button.active{background:#1e514c}.topic-controls input{font:inherit;border:1px solid #d8e1d9;border-radius:8px;padding:9px;flex:1;min-width:150px}.topic-item{border-top:1px solid #e9ece7;padding:14px 0;line-height:1.7;overflow-wrap:anywhere}.topic-item time{color:#66756e;font-size:13px}.topic-item p{font-size:14px;color:#25323a;margin:4px 0}.topic-item a{color:#197561}.topic-item button{padding:0;color:#197561;text-decoration:underline}.layout{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:35px;margin:28px 0 80px}article{background:#fff;border:1px solid #e6e8e2;border-radius:12px;padding:clamp(22px,4vw,50px);line-height:1.9;overflow-wrap:anywhere}article h2{line-height:1.4;margin:0 0 12px;font-size:27px;color:#193d39}article h3{font-size:19px;color:#1b5148;margin:34px 0 12px}article p{margin:13px 0}article a{color:#197561;text-decoration:underline;text-underline-offset:3px}article ul{padding-left:23px}article table{border-collapse:collapse;width:100%;font-size:14px}article .table-wrap{overflow-x:auto}article th,article td{padding:8px 10px;text-align:left;border-bottom:1px solid #e9ece7;white-space:nowrap}article th{background:#f2f7f3}.aside{font-size:14px;color:#66756e;line-height:1.8}.aside strong{color:#334a40}.aside hr{border:0;border-top:1px solid #d9dfd9;margin:20px 0}.empty{padding:50px;text-align:center;color:#6d7e74}footer{color:#859189;font-size:12px;padding-bottom:32px}@media(max-width:700px){.shell{padding:0 16px}.mast{display:block;margin-top:35px}.date{margin-top:20px}.layout{grid-template-columns:1fr;gap:16px}.aside{order:-1}select{margin-left:0;flex:1}article{padding:24px 18px}}
</style></head><body><header><div class="shell"><div class="brand">DAILY BRIEF · 每日早报</div><div class="mast"><div><h1>把重要的事，<br>看清楚。</h1><p class="sub">科技、国际与市场动态，每天为你整理。<br>事实、分析与未来观察，一页读完。</p></div><div class="date" id="updated"></div></div></div></header><main class="shell app"><div class="controls"><button id="tech" class="active" type="button">科技与国际</button><button id="market" type="button">股市早报</button><button id="weekly" type="button">每周趋势</button><select id="dates" aria-label="选择报告日期"></select></div><section class="highlights"><h2>今天最值得知道的事</h2><p id="highlights-date"></p><ol id="highlights-list"></ol></section><section class="topics" aria-labelledby="topic-title"><h2 id="topic-title">议题追踪</h2><p>从已有报告中自动归类，日期是报告日期；打开原报告可查看上下文和来源。</p><div class="topic-controls"><button type="button" data-topic="国际关系" class="active">国际关系</button><button type="button" data-topic="科技">科技</button><button type="button" data-topic="经济与市场">经济与市场</button><input id="topic-search" type="search" placeholder="搜索议题或关键词" aria-label="搜索议题或关键词"></div><div id="timeline" aria-live="polite"></div></section><div class="layout"><article id="report" aria-live="polite"><div class="empty">正在加载报告…</div></article><aside class="aside"><strong>阅读说明</strong><p>报告中的来源链接可直接打开。事实、各方观点与未来推测会分别标注。</p><hr><p>数据以每份报告标注的截止时间为准。切换日期可以查看已有记录。</p></aside></div></main><footer class="shell">每日早报 · 内容以报告注明的信息截止时间为准</footer><script>
const state={data:[],type:'tech',date:'',topic:'国际关系'};const $=id=>document.getElementById(id);function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};function fmt(s){s=esc(s);s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>'<a target="_blank" rel="noopener noreferrer" href="'+url+'">'+label+'</a>');return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')};function renderMD(s){const lines=s.replace(/\r/g,'').split('\n');let html='',list=false;const end=()=>{if(list){html+='</ul>';list=false}};for(let i=0;i<lines.length;i++){let l=lines[i].trim();if(!l){end();continue}if(l.startsWith('|')&&i+1<lines.length&&/^\|[\s:|\-]+\|?$/.test(lines[i+1].trim())){end();let rows=[l];i+=2;while(i<lines.length&&lines[i].trim().startsWith('|'))rows.push(lines[i++].trim());i--;html+='<div class="table-wrap"><table>'+rows.map((r,j)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>'<'+(j?'td':'th')+'>'+fmt(c.trim())+'</'+(j?'td':'th')+'>').join('')+'</tr>').join('')+'</table></div>';continue}let heading=l.match(/^#{1,3}\s+(.+)/);if(heading){end();html+='<h3>'+fmt(heading[1])+'</h3>';continue}if(/^[-*]\s+/.test(l)){if(!list){html+='<ul>';list=true}html+='<li>'+fmt(l.replace(/^[-*]\s+/,''))+'</li>';continue}end();if(/^\*\*[^*]{1,28}\*\*$/.test(l))html+='<h3>'+fmt(l)+'</h3>';else html+='<p>'+fmt(l)+'</p>'}end();return html}const topicPatterns={'国际关系':/中美|中俄|外交|国际|美国|俄乌|南海|东盟|关税|峰会|战争|贸易协议/,'科技':/人工智能|AI|芯片|英伟达|模型|科技|算力|微软|软件|阿里云|网络安全|航天/,'经济与市场':/市场|股市|股价|指数|经济|通胀|利率|央行|联储|消费|投资|成交|A股|港股|美股/};function timeline(){const query=$('topic-search').value.trim().toLowerCase();const rows=[];for(const r of state.data){const paras=r.content.split(/\n\s*\n/).map(x=>x.trim()).filter(x=>x.length>10&&!/^\|/.test(x)&&!/^#{1,3}\s/.test(x));for(const text of paras){if(topicPatterns[state.topic].test(text)&&(!query||(text+' '+r.title+' '+r.date).toLowerCase().includes(query)))rows.push({type:r.type,date:r.date,title:r.title,text})}}rows.sort((a,b)=>b.date.localeCompare(a.date));document.querySelectorAll('[data-topic]').forEach(b=>b.classList.toggle('active',b.dataset.topic===state.topic));$('timeline').innerHTML=rows.length?rows.slice(0,30).map((r,i)=>'<div class="topic-item"><time>报告日期 · '+esc(r.date)+' · '+esc(r.title)+'</time><p>'+fmt(r.text.replace(/\n/g,' ').slice(0,500))+'</p><button type="button" data-open="'+i+'">查看完整报告</button></div>').join(''):'<p>暂无匹配记录，试试其他议题或关键词。</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const r=rows[Number(b.dataset.open)];state.type=r.type;state.date=r.date;update();$('report').scrollIntoView({behavior:'smooth',block:'start'})})}document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{state.topic=b.dataset.topic;timeline()});$('topic-search').oninput=timeline;function showHighlights(){const daily=state.data.filter(x=>x.type==='tech'||x.type==='market');const date=[...new Set(daily.map(x=>x.date))].sort().reverse()[0];$('highlights-date').textContent=date?'报告日期 · '+date+'；更多内容可在下方查看':'暂无今日重点';const items=[];for(const type of ['tech','market']){const r=daily.find(x=>x.date===date&&x.type===type);if(!r)continue;const section=r.content.match(/(?:^|\n)#{1,3}\s*今日重点\s*\n([\s\S]*?)(?=\n#{1,3}\s|$)/);if(section)items.push(...section[1].split('\n').filter(x=>/^\s*[-*]\s+/.test(x)).map(x=>x.replace(/^\s*[-*]\s+/,'')))}$('highlights-list').innerHTML=items.slice(0,5).map(x=>'<li>'+fmt(x)+'</li>').join('');if(!items.length)$('highlights-date').textContent+=' · 新格式报告生成后显示重点';}function update(){const dates=[...new Set(state.data.filter(x=>x.type===state.type).map(x=>x.date))].sort().reverse();if(!dates.includes(state.date))state.date=dates[0]||'';$('dates').innerHTML=dates.map(d=>'<option value="'+esc(d)+'">'+esc(d)+'</option>').join('');$('dates').value=state.date;$('tech').classList.toggle('active',state.type==='tech');$('market').classList.toggle('active',state.type==='market');$('weekly').classList.toggle('active',state.type==='weekly');const r=state.data.find(x=>x.type===state.type&&x.date===state.date);$('report').innerHTML=r?'<h2>'+esc(r.title)+'</h2>'+renderMD(r.content):'<div class="empty">暂无这份报告</div>';$('updated').textContent=state.date?'报告日期 · '+state.date:'暂无报告'}$('tech').onclick=()=>{state.type='tech';state.date='';update()};$('market').onclick=()=>{state.type='market';state.date='';update()};$('weekly').onclick=()=>{state.type='weekly';state.date='';update()};$('dates').onchange=e=>{state.date=e.target.value;update()};fetch('reports.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('加载失败');return r.json()}).then(d=>{state.data=d.reports;showHighlights();timeline();update()}).catch(()=>$('report').innerHTML='<div class="empty">报告暂时无法加载，请稍后重试。</div>');
</script></body></html>
